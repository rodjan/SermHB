# Konfigurace administrace (Decap CMS)
# Přihlášení řeší Netlify Identity + Git Gateway – trenér se přihlásí
# e-mailem a heslem a změny se automaticky uloží do GitHubu a publikují.
#
# Cesty níže předpokládají, že web je v KOŘENI svého repozitáře
# (po přesunutí obsahu této složky do vlastního repozitáře).

backend:
  name: git-gateway
  # POZOR: branch musí odpovídat větvi, ze které Netlify publikuje web
  # (obvykle "main").
  branch: main

media_folder: "public/uploads"
public_folder: "/uploads"

locale: "cs"
publish_mode: simple

site_url: https://sermhb.cz
display_url: https://sermhb.cz
logo_url: /images/logo.svg

collections:
  # ----- AKTUALITY -----
  - name: "aktuality"
    label: "Aktuality"
    label_singular: "Aktualita"
    folder: "src/content/aktuality"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    summary: "{{title}} ({{date}})"
    sortable_fields: ["date", "title"]
    fields:
      - { name: "title", label: "Nadpis", widget: "string" }
      - { name: "date", label: "Datum", widget: "datetime", format: "YYYY-MM-DD", date_format: "DD.MM.YYYY", time_format: false }
      - { name: "perex", label: "Krátký úvod (perex)", widget: "text", required: false, hint: "Pár vět, které se zobrazí v náhledu článku." }
      - { name: "cover", label: "Úvodní obrázek", widget: "image", required: false }
      - { name: "draft", label: "Koncept (nezveřejňovat)", widget: "boolean", default: false }
      - { name: "body", label: "Text příspěvku", widget: "markdown" }

  # ----- VÝSLEDKY -----
  - name: "vysledky"
    label: "Výsledky a závody"
    label_singular: "Výsledek"
    folder: "src/content/vysledky"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    summary: "{{title}} ({{date}})"
    sortable_fields: ["date", "title"]
    fields:
      - { name: "title", label: "Název závodu", widget: "string" }
      - { name: "date", label: "Datum", widget: "datetime", format: "YYYY-MM-DD", date_format: "DD.MM.YYYY", time_format: false }
      - { name: "misto", label: "Místo", widget: "string", required: false }
      - { name: "zbran", label: "Zbraň", widget: "select", options: ["fleret", "kord", "šavle", "ostatní"], default: "fleret" }
      - { name: "cover", label: "Úvodní obrázek", widget: "image", required: false }
      - { name: "draft", label: "Koncept (nezveřejňovat)", widget: "boolean", default: false }
      - { name: "body", label: "Popis a výsledky", widget: "markdown" }

  # ----- FOTOGALERIE -----
  - name: "galerie"
    label: "Fotogalerie"
    label_singular: "Album"
    folder: "src/content/galerie"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    summary: "{{title}} ({{date}})"
    sortable_fields: ["date", "title"]
    fields:
      - { name: "title", label: "Název alba", widget: "string" }
      - { name: "date", label: "Datum", widget: "datetime", format: "YYYY-MM-DD", date_format: "DD.MM.YYYY", time_format: false }
      - { name: "cover", label: "Titulní fotka", widget: "image", required: false }
      - { name: "draft", label: "Koncept (nezveřejňovat)", widget: "boolean", default: false }
      - label: "Fotky"
        name: "fotky"
        widget: "list"
        label_singular: "Fotka"
        summary: "{{fields.popis}}"
        fields:
          - { name: "obrazek", label: "Fotka", widget: "image" }
          - { name: "popis", label: "Popisek", widget: "string", required: false }
      - { name: "body", label: "Popis alba", widget: "markdown", required: false }

  # ----- TRENÉŘI -----
  - name: "treneri"
    label: "Trenéři"
    label_singular: "Trenér"
    folder: "src/content/treneri"
    create: true
    slug: "{{slug}}"
    summary: "{{name}}"
    sortable_fields: ["order", "name"]
    fields:
      - { name: "name", label: "Jméno", widget: "string" }
      - { name: "role", label: "Funkce / role", widget: "string", required: false }
      - { name: "photo", label: "Fotka", widget: "image", required: false }
      - { name: "email", label: "E-mail", widget: "string", required: false }
      - { name: "phone", label: "Telefon", widget: "string", required: false }
      - { name: "order", label: "Pořadí (menší = první)", widget: "number", default: 100, value_type: "int" }
      - { name: "body", label: "Představení", widget: "markdown", required: false }

  # ----- DOKUMENTY -----
  - name: "dokumenty"
    label: "Dokumenty ke stažení"
    label_singular: "Dokument"
    folder: "src/content/dokumenty"
    create: true
    slug: "{{slug}}"
    summary: "{{title}}"
    sortable_fields: ["order", "title"]
    fields:
      - { name: "title", label: "Název dokumentu", widget: "string" }
      - { name: "file", label: "Soubor (PDF apod.)", widget: "file" }
      - { name: "kategorie", label: "Kategorie", widget: "string", default: "Ostatní", hint: "Např. Přihlášky, Formuláře, Rozpisy" }
      - { name: "date", label: "Datum", widget: "datetime", format: "YYYY-MM-DD", date_format: "DD.MM.YYYY", time_format: false, required: false }
      - { name: "order", label: "Pořadí (menší = první)", widget: "number", default: 100, value_type: "int" }
      - { name: "body", label: "Popis", widget: "markdown", required: false }

  # ----- STRÁNKY (pevné texty) -----
  - name: "stranky"
    label: "Stránky (texty)"
    label_singular: "Stránka"
    delete: false
    files:
      - name: "o-klubu"
        label: "O klubu"
        file: "src/content/stranky/o-klubu.md"
        fields:
          - { name: "title", label: "Titulek", widget: "hidden", default: "O klubu" }
          - { name: "body", label: "Obsah", widget: "markdown" }
      - name: "treninky"
        label: "Tréninky (rozpis)"
        file: "src/content/stranky/treninky.md"
        fields:
          - { name: "title", label: "Titulek", widget: "hidden", default: "Tréninky" }
          - { name: "body", label: "Obsah", widget: "markdown" }
      - name: "nabor"
        label: "Nábor"
        file: "src/content/stranky/nabor.md"
        fields:
          - { name: "title", label: "Titulek", widget: "hidden", default: "Nábor" }
          - { name: "body", label: "Obsah", widget: "markdown" }
      - name: "kontakt"
        label: "Kontakt"
        file: "src/content/stranky/kontakt.md"
        fields:
          - { name: "title", label: "Titulek", widget: "hidden", default: "Kontakt" }
          - { name: "body", label: "Obsah", widget: "markdown" }
      - name: "prispevky"
        label: "Členské příspěvky"
        file: "src/content/stranky/prispevky.md"
        fields:
          - { name: "title", label: "Titulek", widget: "hidden", default: "Členské příspěvky" }
          - { name: "body", label: "Obsah", widget: "markdown" }
