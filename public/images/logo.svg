<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 200" role="img" aria-label="ŠERM Havlíčkův Brod">
  <title>ŠERM Havlíčkův Brod</title>
  <!-- Emblém: šermíř ve výpadu s fleretem (line-art podle nášivky) -->
  <g transform="translate(8,2)" fill="none" stroke="#10233f" stroke-width="7"
     stroke-linecap="round" stroke-linejoin="round">
    <!-- zadní natažená noha -> kyčel -> přední koleno -> chodidlo -->
    <path d="M30 176 L112 96 L150 122 L150 176" />
    <!-- chodidla -->
    <path d="M26 176 L52 176" />
    <path d="M146 176 L172 176" />
    <!-- trup -->
    <path d="M112 96 L126 56" />
    <!-- ozbrojená paže -->
    <path d="M126 58 L176 62" />
    <!-- zadní paže zdvižená -->
    <path d="M126 58 L104 32 L120 13" />
    <!-- čepel fleretu -->
    <path d="M188 60 L246 45" />
  </g>
  <!-- hlava s maskou -->
  <circle cx="143" cy="42" r="15" fill="#10233f" />
  <!-- záštita (zvonec) fleretu -->
  <circle cx="185" cy="61" r="6.5" fill="#10233f" />

  <!-- Slovní značka -->
  <g fill="#10233f" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif">
    <text x="280" y="108" font-size="92" font-weight="800" letter-spacing="2">ŠERM</text>
    <text x="283" y="150" font-size="31" font-weight="600" letter-spacing="5">HAVLÍČKŮV BROD</text>
  </g>
</svg>
